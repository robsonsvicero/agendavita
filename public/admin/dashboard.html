<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Admin</title>
    <style>
      body { font-family: sans-serif; margin: 24px; background: #f5f7fb; color: #212121; }
      h1 { margin-top: 0; }
      .card { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
      input, select, button { padding: 8px; margin-right: 6px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
      .row { margin-bottom: 10px; }
      pre { white-space: pre-wrap; background: #111; color: #b8f8c9; padding: 10px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <h1>Dashboard</h1>

    <div class="card">
      <div class="row">
        <input id="filterDate" type="date" />
        <select id="filterStatus">
          <option value="">Todos os status</option>
          <option value="pending">pending</option>
          <option value="confirmed">confirmed</option>
          <option value="cancelled">cancelled</option>
          <option value="cancel_requested">cancel_requested</option>
          <option value="reschedule_requested">reschedule_requested</option>
        </select>
        <button id="btnLoad">Carregar agendamentos</button>
        <button id="btnPatients">Carregar pacientes</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Paciente</th>
            <th>Status</th>
            <th>Acoes</th>
          </tr>
        </thead>
        <tbody id="appointmentsBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Pacientes</h2>
      <pre id="patientsOut">[]</pre>
    </div>

    <script>
      const token = localStorage.getItem('adminToken');
      if (!token) window.location.href = '/admin/login.html';

      const authHeaders = {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`
      };

      async function loadAppointments() {
        const date = document.getElementById('filterDate').value;
        const status = document.getElementById('filterStatus').value;
        const qs = new URLSearchParams();
        if (date) qs.set('date', date);
        if (status) qs.set('status', status);

        const res = await fetch(`/api/admin/appointments?${qs.toString()}`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!res.ok) return;
        const items = await res.json();
        const tbody = document.getElementById('appointmentsBody');
        tbody.innerHTML = '';

        for (const a of items) {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${a.id}</td>
            <td>${a.date ? String(a.date).slice(0, 10) : ''}</td>
            <td>${a.time || ''}</td>
            <td>${a.patient_name || ''}</td>
            <td>${a.status || ''}</td>
            <td>
              <button data-id="${a.id}" data-act="confirm">Confirmar</button>
              <button data-id="${a.id}" data-act="cancel">Cancelar</button>
            </td>
          `;
          tbody.appendChild(tr);
        }

        tbody.querySelectorAll('button').forEach((btn) => {
          btn.onclick = async () => {
            const id = btn.dataset.id;
            const act = btn.dataset.act;
            await fetch(`/api/admin/appointments/${id}/${act}`, {
              method: 'PATCH',
              headers: authHeaders
            });
            await loadAppointments();
          };
        });
      }

      async function loadPatients() {
        const res = await fetch('/api/admin/patients', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        document.getElementById('patientsOut').textContent = JSON.stringify(data, null, 2);
      }

      document.getElementById('btnLoad').onclick = loadAppointments;
      document.getElementById('btnPatients').onclick = loadPatients;
      loadAppointments();
    </script>
  </body>
</html>
