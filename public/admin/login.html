<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin</title>
    <style>
      body { font-family: sans-serif; margin: 24px; background: #f6f7fb; }
      .box { max-width: 420px; margin: 40px auto; background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
      label { display: block; margin: 10px 0 4px; }
      input, button { width: 100%; padding: 10px; box-sizing: border-box; }
      button { margin-top: 12px; cursor: pointer; }
      pre { white-space: pre-wrap; background: #111; color: #b8f8c9; padding: 10px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Area Admin</h1>
      <label>Email</label>
      <input id="email" type="email" />
      <label>Senha</label>
      <input id="password" type="password" />
      <button id="btnLogin">Entrar</button>
      <pre id="out">{}</pre>
    </div>

    <script>
      document.getElementById('btnLogin').onclick = async () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        document.getElementById('out').textContent = JSON.stringify(data, null, 2);

        if (res.ok && data.token) {
          localStorage.setItem('adminToken', data.token);
          window.location.href = '/admin/dashboard.html';
        }
      };
    </script>
  </body>
</html>
