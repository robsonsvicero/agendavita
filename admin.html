<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Supabase</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background: #f5f7fb; color: #222; }
      .card { background: white; border-radius: 12px; padding: 18px; margin: 16px 0; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
      input, button { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 8px; }
      button { cursor: pointer; }
      table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
      .status { margin-top: 10px; padding: 10px; border-radius: 8px; background: #f0f2f5; }
      .status.error { background: #ffe5e5; color: #7a1d1d; }
      .status.ok { background: #e8f8ed; color: #1a5d3a; }
    </style>
  </head>
  <body>
    <h1>Painel administrativo</h1>

    <div class="card" id="loginCard">
      <h2>Entrar</h2>
      <input id="adminEmail" type="email" placeholder="email" />
      <input id="adminPassword" type="password" placeholder="senha" />
      <button id="loginBtn">Entrar</button>
      <div id="loginStatus" class="status">Aguardando login.</div>
    </div>

    <div class="card" id="dashboardCard" style="display:none;">
      <h2>Agendamentos</h2>
      <button id="loadAppointmentsBtn">Carregar</button>
      <table>
        <thead>
          <tr><th>ID</th><th>Data</th><th>Hora</th><th>Paciente</th><th>Status</th></tr>
        </thead>
        <tbody id="appointmentsBody"></tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
