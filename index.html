<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento — Supabase</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background: #f5f7fb; color: #222; }
      .card { background: white; border-radius: 12px; padding: 18px; margin: 16px 0; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
      label { display: block; margin-top: 10px; font-weight: 600; }
      input, button, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; margin-top: 6px; }
      button { cursor: pointer; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      .status { margin-top: 12px; padding: 10px; border-radius: 8px; background: #f0f2f5; }
      .status.error { background: #ffe5e5; color: #7a1d1d; }
      .status.ok { background: #e8f8ed; color: #1a5d3a; }
      ul { padding-left: 18px; }
    </style>
  </head>
  <body>
    <h1>Agendamento online</h1>
    <p>Versão estática conectada ao Supabase.</p>

    <div class="card">
      <h2>Buscar horários</h2>
      <div class="grid">
        <div>
          <label>Slug da clínica</label>
          <input id="clinicSlug" placeholder="ex: clinica-centro" />
        </div>
        <div>
          <label>Data</label>
          <input id="appointmentDate" type="date" />
        </div>
      </div>
      <button id="loadSlotsBtn">Buscar horários</button>
      <div id="slotsStatus" class="status">Aguardando dados.</div>
      <ul id="slotsList"></ul>
    </div>

    <div class="card">
      <h2>Criar agendamento</h2>
      <div class="grid">
        <div>
          <label>Slug</label>
          <input id="bookingSlug" placeholder="slug da clínica" />
        </div>
        <div>
          <label>Nome</label>
          <input id="patientName" />
        </div>
        <div>
          <label>Telefone</label>
          <input id="patientPhone" />
        </div>
        <div>
          <label>Email</label>
          <input id="patientEmail" />
        </div>
      </div>
      <div class="grid">
        <div>
          <label>Data</label>
          <input id="bookingDate" type="date" />
        </div>
        <div>
          <label>Horário</label>
          <input id="bookingTime" placeholder="HH:MM" />
        </div>
      </div>
      <label>Endereço</label>
      <input id="patientAddress" />
      <label>Observações</label>
      <textarea id="notes"></textarea>
      <button id="createBookingBtn">Salvar agendamento</button>
      <div id="bookingStatus" class="status">Aguardando envio.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
